name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The release workflow runs the same gates before it builds anything.
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to check out (default: the triggering ref)"
        type: string
        required: false
        default: ""

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release
  # run never cancels, or is cancelled by, a CI run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Versions agree
        run: pnpm version:check

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Startup bundle budget
        run: pnpm size:eager

      - name: Unused files, deps and exports
        run: pnpm knip

      # Split so a failure says immediately whether it ships to users or only
      # affects the build toolchain. Both gate: a compromised build dependency
      # can inject into the bundle just as effectively as a runtime one.
      - name: Dependency advisories (production)
        run: pnpm audit --prod

      - name: Dependency advisories (including dev)
        run: pnpm audit

  rust-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      # rust-toolchain.toml pins the version and components.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # The crate has no doctests, which nextest does not run; add
      # `cargo test --doc --locked` here if one appears.
      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked

      # ts-rs writes the generated bindings during the test run, so a stale
      # committed copy only shows up as a diff right after it.
      - name: Generated TypeScript bindings are up to date
        run: git diff --exit-code src/modules/device/generated

      - name: Dependency advisories
        working-directory: src-tauri
        run: cargo audit
