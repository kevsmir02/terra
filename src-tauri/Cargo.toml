[package]
name = "terra"
version = "0.9.4"
description = "Terra, a terminal-first IDE for agent harnesses"
authors = ["kevsmir02"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "7"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
regex = "1"
sha2 = "0.10"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tempfile = "3"
notify = "8.2.0"
which = "8.0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tokio = "1"
minisign-verify = "0.2"
base64 = "0.23"
libc = "0.2"
# Native consent prompt for a workspace root the webview asks for (ADR 0006);
# already linked through tauri, so this adds no code, only the import.
gtk = "0.18"
# WebKitGTK can't read external clipboard copies.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
ts-rs = "12"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
# Unwind, not abort: sync.rs recovers poisoned locks so one panicking thread
# (a PTY reader, an LSP pump) costs that session, not every terminal at once.
panic = "unwind"
strip = true
